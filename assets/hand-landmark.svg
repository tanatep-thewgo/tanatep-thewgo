<svg width="420" height="480" viewBox="0 0 420 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#121212" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- card -->
  <g transform="rotate(-1.6 210 210)">
    <rect x="30" y="20" width="360" height="360" rx="20" fill="#F6F6F6" stroke="#E4E4E4" stroke-width="1.5" filter="url(#cardShadow)"/>
    <!-- tape -->
    <rect x="58" y="10" width="64" height="22" rx="2" fill="#2E5AF0" fill-opacity="0.14" stroke="#2E5AF0" stroke-opacity="0.25" transform="rotate(-4 90 21)"/>

    <!-- prediction chip -->
    <rect x="248" y="42" width="126" height="30" rx="15" fill="#B8862E" fill-opacity="0.09" stroke="#B8862E" stroke-opacity="0.30"/>
    <text x="311" y="61" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#8A6A20">OPEN_PALM &#183; 99.2%</text>

    <!-- hand landmark graph -->
    <g transform="translate(70,60)">
      <!-- edges -->
      <g stroke="#2E5AF0" stroke-opacity="0.45" stroke-width="1.6" fill="none">
        <line x1="150" y1="275" x2="124" y2="254"/>
        <line x1="124" y1="254" x2="103" y2="224"/>
        <line x1="103" y1="224" x2="88" y2="194"/>
        <line x1="88" y1="194" x2="75" y2="170"/>

        <line x1="150" y1="275" x2="129" y2="185"/>
        <line x1="129" y1="185" x2="124" y2="140"/>
        <line x1="124" y1="140" x2="121" y2="104"/>
        <line x1="121" y1="104" x2="119" y2="74"/>

        <line x1="129" y1="185" x2="155" y2="179"/>
        <line x1="155" y1="179" x2="158" y2="128"/>
        <line x1="158" y1="128" x2="158" y2="86"/>
        <line x1="158" y1="86" x2="158" y2="50"/>

        <line x1="155" y1="179" x2="181" y2="185"/>
        <line x1="181" y1="185" x2="186" y2="137"/>
        <line x1="186" y1="137" x2="189" y2="98"/>
        <line x1="189" y1="98" x2="192" y2="68"/>

        <line x1="181" y1="185" x2="205" y2="200"/>
        <line x1="205" y1="200" x2="212" y2="161"/>
        <line x1="212" y1="161" x2="218" y2="131"/>
        <line x1="218" y1="131" x2="223" y2="107"/>

        <line x1="150" y1="275" x2="205" y2="200"/>
      </g>

      <!-- joint nodes -->
      <g fill="#2E5AF0">
        <circle cx="150" cy="275" r="3.4"/>
        <circle cx="124" cy="254" r="3.4"/>
        <circle cx="103" cy="224" r="3.4"/>
        <circle cx="88" cy="194" r="3.4"/>
        <circle cx="129" cy="185" r="3.4"/>
        <circle cx="124" cy="140" r="3.4"/>
        <circle cx="121" cy="104" r="3.4"/>
        <circle cx="155" cy="179" r="3.4"/>
        <circle cx="158" cy="128" r="3.4"/>
        <circle cx="158" cy="86" r="3.4"/>
        <circle cx="181" cy="185" r="3.4"/>
        <circle cx="186" cy="137" r="3.4"/>
        <circle cx="189" cy="98" r="3.4"/>
        <circle cx="205" cy="200" r="3.4"/>
        <circle cx="212" cy="161" r="3.4"/>
        <circle cx="218" cy="131" r="3.4"/>
      </g>

      <!-- fingertip nodes (accent 2) -->
      <g fill="#B8862E">
        <circle cx="75" cy="170" r="4.6"/>
        <circle cx="119" cy="74" r="4.6"/>
        <circle cx="158" cy="50" r="4.6"/>
        <circle cx="192" cy="68" r="4.6"/>
        <circle cx="223" cy="107" r="4.6"/>
      </g>
    </g>

    <!-- readout -->
    <rect x="52" y="270" width="172" height="72" rx="8" fill="#FFFFFF" fill-opacity="0.85" stroke="#E4E4E4"/>
    <text x="66" y="292" font-family="Menlo, Consolas, monospace" font-size="12" fill="#9C9C9C">landmark <tspan fill="#2E5AF0">08</tspan></text>
    <text x="66" y="311" font-family="Menlo, Consolas, monospace" font-size="12" fill="#9C9C9C">x <tspan fill="#2E5AF0">0.401</tspan> y <tspan fill="#2E5AF0">0.215</tspan></text>
    <text x="66" y="330" font-family="Menlo, Consolas, monospace" font-size="12" fill="#9C9C9C">z <tspan fill="#2E5AF0">-0.016</tspan></text>
  </g>

  <!-- caption -->
  <text x="210" y="440" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#656565">pulled straight from the GestureTalk demo,</text>
  <text x="210" y="462" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#656565">not a stock icon</text>
</svg>
